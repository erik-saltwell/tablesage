[project]
name = "tablesage-rpg"
version = "0.1.0"
description = "Turn tabletop roleplaying session recordings into transcripts, recaps, and campaign summaries."
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Erik Saltwell", email = "erik.saltwell@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.4",
  "clearvoice>=0.1.2",
  "elevenlabs>=2.46.0",
  "huggingface-hub>=1.14.0",
  "jinja2>=3.1.0",
  "jiwer>=3.1.0",
  "litellm>=1.99.0",
  "modelscope[framework]>=1.36.3",
  "numpy>=1.26.4",
  "punctuators>=0.0.7",
  "pydantic>=2.12.5",
  "platformdirs>=4.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "soundfile>=0.12.1",
  "sqlalchemy>=2.0",
  "sqlmodel>=0.0.39",
  "structlog>=25.5.0",
  "textual>=8.2.6",
  "textual-fspicker>=1.0.1",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "wespeaker-unofficial>=0.0.2",
  "widelog-py>=2026.7.2",
]

[project.scripts]
tablesage-rpg = "tablesage_tui.screens:main"
tablesage = "tablesage_tui.screens:main"

[project.urls]
Repository = "https://github.com/erik-saltwell/tablesage"
Issues = "https://github.com/erik-saltwell/tablesage/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/tablesage-tui/src/tablesage_tui",
  "packages/tablesage-application/src/tablesage_application",
  "packages/tablesage-model/src/tablesage_model",
  "packages/tablesage-tools/src/tablesage_tools",
]

[tool.hatch.build.targets.sdist]
only-include = [
  "pyproject.toml", "README.md", "LICENSE",
  "apps/tablesage-tui/src", "packages/tablesage-application/src",
  "packages/tablesage-model/src", "packages/tablesage-tools/src",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.13",
  "mypy>=1.18",
  "ty>=0.0.35",
  "pre-commit>=4.6.0",
  "textual-dev>=1.8.0",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  # Type annotation enforcement
  "ANN001", # missing type annotation for function argument
  "ANN002", # missing type annotation for *args
  "ANN003", # missing type annotation for **kwargs
  "ANN201", # missing return type annotation for public function
  "ANN202", # missing return type annotation for private function
  "ANN204", # missing return type annotation for special method
  "ANN205", # missing return type annotation for staticmethod
  "ANN206", # missing return type annotation for classmethod
]

[tool.ty]
environment.root = ["./packages", "./apps", "./benchmarks"]

[tool.ty.rules]
unused-ignore-comment = "warn"
redundant-cast = "warn"

[tool.pytest.ini_options]
testpaths = [
  "packages",
  "apps/tablesage-tui",
]

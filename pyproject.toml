[project]
name = "tablesage-workspace"
version = "0.1.0"
description = "Workspace root for TableSage."
requires-python = ">=3.12"
# The root project itself ships no code -- these exist so a bare `uv sync`/`uv run` installs
# every workspace member's full dependency tree (tablesage-tui transitively pulls in
# tablesage-application, tablesage-tools, tablesage-model). Without this, root's own
# dependency list was empty, so a plain `uv sync` synced *only* this project (plus the dev
# group) and silently pruned everything else out of .venv -- including things like the
# en-core-web-sm spacy model that aren't declared as PyPI-style deps anywhere else.
dependencies = [
  "tablesage-application",
  "tablesage-model",
  "tablesage-prompt-metrics",
  "tablesage-tools",
  "tablesage-tui",
]

[tool.uv.workspace]
members = [
  "packages/*",
  "apps/*",
]

[tool.uv.sources]
tablesage-application = { workspace = true }
tablesage-model = { workspace = true }
tablesage-prompt-metrics = { workspace = true }
tablesage-tools = { workspace = true }
tablesage-tui = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.13",
  "mypy>=1.18",
  "ty>=0.0.35",
  "pre-commit>=4.6.0",
  # Also declared in apps/tablesage-tui's own dev group, but a package-scoped dev group
  # doesn't sync by default with a bare `uv sync` the way the root's does -- duplicated
  # here so `textual run --dev` keeps working after one.
  "textual-dev>=1.8.0",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  # Type annotation enforcement
  "ANN001", # missing type annotation for function argument
  "ANN002", # missing type annotation for *args
  "ANN003", # missing type annotation for **kwargs
  "ANN201", # missing return type annotation for public function
  "ANN202", # missing return type annotation for private function
  "ANN204", # missing return type annotation for special method
  "ANN205", # missing return type annotation for staticmethod
  "ANN206", # missing return type annotation for classmethod
]

[tool.ty]
environment.root = ["./packages", "./apps", "./benchmarks"]

[tool.ty.rules]
unused-ignore-comment = "warn"
redundant-cast = "warn"

[tool.pytest.ini_options]
testpaths = [
  "packages",
  "apps",
]

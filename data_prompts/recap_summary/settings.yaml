target_llm:
  model: openai/gpt-5.6-sol
  effort: low
  extra:
    allowed_openai_params:
      - reasoning_effort

actor_llm:
  model: openai/gpt-5.6-sol
  effort: medium
  temperature: 1.0
  extra:
    allowed_openai_params:
      - reasoning_effort

judge_llm:
  model: openai/gpt-5.6-sol
  effort: medium
  extra:
    allowed_openai_params:
      - reasoning_effort

alignment_threshold: 1.0
judge_attempts: 3

# Working read-aloud budget; under-target recaps receive the same length score.
length:
  target_words: 180
  max_words: 240
  max_bullets: 6

optimizer:
  iterations: 5
  top_k_per_iteration: 2
  floor: 3
  ucb_budget: 3
  seed_warmup_pulls: 3
  max_children_per_parent: 2
  early_stop_patience: 3
  max_llm_concurrency: 1
  error_budget: 0
  seed: 1

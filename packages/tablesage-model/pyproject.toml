version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erik Saltwell", email = "erik.saltwell@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "structlog>=25.5.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
    "clearvoice>=0.1.2",
    "elevenlabs>=2.46.0",
    "jiwer>=3.1.0",
    "litellm>=1.83.0",
    "pyannote-audio",
    "onnxruntime>=1.18.0",
    "pyannote-metrics>=3.2.1",
    "pydantic>=2.12.5",
    "mathspell>=0.1.0",
    "punctuators>=0.0.7",
    "modelscope[framework]>=1.36.3",
    "sqlmodel>=0.0.39",
    "alembic>=1.18.4",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

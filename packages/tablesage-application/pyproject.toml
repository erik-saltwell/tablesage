[project]
name = "tablesage-application"
version = "0.1.0"
description = "Use-case orchestration for TableSage."
readme = "README.md"
authors = [
    { name = "Erik Saltwell", email = "erik.saltwell@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tablesage-model",
    "tablesage-tools",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
tablesage-model = { workspace = true }
tablesage-tools = { workspace = true }

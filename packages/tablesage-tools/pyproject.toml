[project]
name = "tablesage-tools"
version = "0.1.0"
description = "Independent media and provider adapters (audio, transcription, embeddings, similarity, centroid, text post-processing)."
readme = "README.md"
authors = [
    { name = "Erik Saltwell", email = "erik.saltwell@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clearvoice>=0.1.2",
    "elevenlabs>=2.46.0",
    "jiwer>=3.1.0",
    "litellm>=1.83.0",
    "mathspell>=0.1.0",
    "modelscope[framework]>=1.36.3",
    "pydantic>=2.12.5",
    "punctuators>=0.0.7",
    "structlog>=25.1.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

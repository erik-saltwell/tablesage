repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: ty
        name: ty check
        entry: uv run ty check packages apps/tablesage-tui
        language: system
        pass_filenames: false

      - id: ty-optimization
        name: ty check prompt optimization
        entry: uv run --project apps/optimize-prompts ty check --python apps/optimize-prompts/.venv apps/optimize-prompts
        language: system
        files: ^apps/optimize-prompts/
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-optimization
        name: pytest prompt optimization
        entry: uv run --project apps/optimize-prompts pytest apps/optimize-prompts/tests
        language: system
        files: ^apps/optimize-prompts/
        pass_filenames: false
        stages: [pre-push]

[project]
name = "tablesage-tui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erik Saltwell", email = "erik.saltwell@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tablesage-application",
    "textual>=8.2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
tablesage-tui = "tablesage_tui.screens:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
tablesage-application = { workspace = true }

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]

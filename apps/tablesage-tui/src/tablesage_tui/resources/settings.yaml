# TableSage settings.
#
# Deployed to .tablesage/settings.yaml the first time the app runs in a given
# directory (this packaged copy is only the seed for that file -- once it
# exists, your edits there persist and this file is never consulted again).

remove_outliers:
  # Player Detail's "Clean Up" (C) prunes voice clips whose embedding falls
  # below this cosine-similarity bar against the centroid, one worst clip at
  # a time, recomputing between removals.
  min_sample_similarity: 0.6
  # Never prune a player's clips below this floor.
  min_samples: 5

session_audio_import:
  # Session Detail's "Import Audio" (I) always runs the imported recording
  # through the audio-cleaning pipeline; this toggles loudness normalization
  # on top of that cleaning.
  normalize_volume: false

audio_cleaning:
  # Player Detail's "Folder Imp" (F) asks whether to clean each wav through
  # the audio-cleaning pipeline before importing it; this toggles loudness
  # normalization on top of that cleaning, same as session_audio_import above.
  normalize_volume: false

transcription_and_diarization:
  # Session Detail's "Transcribe" (T) sends the session's input audio to
  # ElevenLabs Scribe for transcription and speaker diarization.
  timeout: 7200
  language_code: eng
  tag_audio_events: false
  model_id: scribe_v2

speaker_identification:
  # After diarization, each utterance's voice is compared against attending
  # players' centroids; a match whose margin over the runner-up falls below
  # this threshold is left as "Unassigned Speaker" rather than guessed.
  similarity_margin_threshold: 0.1
  # When true, "Transcribe" (T) writes one line per utterance to
  # .tablesage/logs/speaker_identification.log -- best/second-best speaker
  # match, the full per-speaker similarity vector, and why the utterance
  # landed where it did. Off by default: verbose (one line per utterance,
  # not one per operation like the rest of tablesage.log), meant for digging
  # into unexpectedly high Unassigned Speaker counts, not routine runs.
  log_diagnostics: false

enhance_voices:
  # Players List's "From Session" (S) pulls high-confidence voice clips out
  # of a transcribed session's utterances. This is a stricter bar than
  # speaker_identification's own threshold above -- an utterance can be
  # confident enough to attribute to a player without being confident enough
  # to bank as a new training sample for that player's voice profile.
  min_margin_for_voice_sample: 0.15
  # Utterances shorter than this make weak training samples; excluded.
  min_clip_seconds: 1.0
  # Utterances longer than this are likely a mis-segmented run-on; excluded.
  max_clip_seconds: 8.0

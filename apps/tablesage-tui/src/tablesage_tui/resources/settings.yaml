# TableSage settings.
#
# Deployed to .tablesage/settings.yaml the first time the app runs in a given
# directory (this packaged copy is only the seed for that file -- once it
# exists, your edits there persist and this file is never consulted again).

settings_version: 0
connection_test_timeout: 30
opportunities_timeout: 600  # Generate Opportunities uses llm_model_high.

# Create Previously On uses llm_model_high for all three stages.
previously_on:
  ingredient_timeout: 600
  scout_timeout: 600
  editor_timeout: 600

remove_outliers:
  # Player Detail's "Clean Up" (C) prunes voice clips whose embedding falls
  # below this cosine-similarity bar against the centroid, one worst clip at
  # a time, recomputing between removals.
  min_sample_similarity: 0.6
  # Never prune a player's clips below this floor.
  min_samples: 5

session_audio_import:
  # Process -> Audio runs an imported recording through the audio-cleaning
  # pipeline; this toggles loudness normalization on top of that cleaning.
  normalize_volume: false

audio_cleaning:
  # Player Detail's "Folder Imp" (F) asks whether to clean each wav through
  # the audio-cleaning pipeline before importing it; this toggles loudness
  # normalization on top of that cleaning, same as session_audio_import above.
  normalize_volume: false

transcription_and_diarization:
  # Process -> Audio sends the Session's input audio to ElevenLabs Scribe for
  # transcription and speaker diarization.
  timeout: 7200
  language_code: eng
  tag_audio_events: false
  model_id: scribe_v2

speaker_identification:
  # For utterances shorter than duration_override.min_seconds, a match whose margin over the
  # runner-up falls below this threshold is left as "Unassigned Speaker" rather than guessed.
  similarity_margin_threshold: 0.10
  # Experiment #7 found that longer clips contain enough voice evidence to use a lower margin.
  duration_override:
    min_seconds: 1.0
    similarity_margin_threshold: 0.04
  # Experiment #9 gives short clips more speaker evidence by concatenating only nearby speech
  # from the same ElevenLabs diarization cluster. The original duration still selects the margin
  # threshold above; widening never activates the looser duration override by itself.
  short_utterance_widening:
    enabled: true
    max_original_duration_seconds: 0.75
    target_duration_seconds: 1.0
    max_neighbor_gap_seconds: 2.0
  # Experiment #8 independently labels each diarization cluster from pooled, sufficiently long
  # utterance embeddings, then uses that label only to rescue short per-utterance abstentions.
  cluster_propagation:
    enabled: true
    evidence_min_duration_seconds: 0.5
    max_utterance_duration_seconds: 0.5
    cluster_margin_threshold: 0.0
    # Keep an abstention when its own embedding favors another player by at least this margin.
    contradiction_veto_margin_threshold: 0.02
  # When false, both margin checks above are skipped entirely -- the best-matching player is
  # always assigned, however close the runner-up was. Utterances too short to embed at all are
  # unaffected either way; they're still left "Unassigned Speaker" since there's no similarity
  # comparison to make for them in the first place.
  allow_unassigned: true
  # When true, Process -> Audio writes an initial-match line per utterance to
  # .tablesage/logs/speaker_identification.log -- best/second-best speaker
  # match, the full per-speaker similarity vector, and why the utterance
  # landed where it did. Cluster-propagated utterances get a second override
  # line. Off by default: verbose, meant for digging into unexpectedly high
  # Unassigned Speaker counts, not routine runs.
  log_diagnostics: false

enhance_voices:
  # Players List's "From Session" (S) pulls high-confidence voice clips out
  # of a transcribed session's utterances. This is a stricter bar than
  # speaker_identification's own duration-conditioned assignment rule above -- an utterance can be
  # confident enough to attribute to a player without being confident enough
  # to bank as a new training sample for that player's voice profile.
  min_margin_for_voice_sample: 0.15
  # Utterances shorter than this make weak training samples; excluded.
  min_clip_seconds: 1.0
  # Utterances longer than this are likely a mis-segmented run-on; excluded.
  max_clip_seconds: 8.0
  # A hard technical floor, not a quality bar: the voice-embedding model can't compute a
  # feature window on a clip shorter than this and errors out. Unlike min_clip_seconds/
  # max_clip_seconds above, this also applies when pulling clips from a completed Manual
  # Review, which otherwise trusts every human-assigned utterance with no duration check.
  min_embeddable_clip_seconds: 0.15

speaker_bootstrap:
  # Isolate New Speakers reads the whole name-corrected transcript in one LLM call (llm_model), so it
  # uses these two with a generous timeout. It asks for about target_total_speech_seconds per
  # player and falls back to voice clustering for a player under min_total_speech_seconds (see
  # isolate_new_speakers below for its own length limits). The section keeps its older name so
  # values you have tuned still apply.
  evidence_timeout: 300
  evidence_max_attempts: 2
  min_total_speech_seconds: 15.0
  target_total_speech_seconds: 30.0

isolate_new_speakers:
  # Process Session's Isolate New Speakers step. Shortest utterance kept as a candidate
  # voice sample, whether the LLM picked it or the voice fallback added it.
  min_speech_seconds: 1.0
  # A player whose picks fall short gets additions from their diarization label. The
  # fallback drops its shortest additions until they total at most
  # fallback_max_speech_seconds or all reach fallback_short_clip_seconds, removes voice
  # outliers, then drops the additions least like the player's voice until under the cap.
  # The LLM's own picks are never dropped or counted against the cap.
  fallback_short_clip_seconds: 2.0
  fallback_max_speech_seconds: 60.0
  # "The player's voice" is the LLM's picks once they total this much speech; below it,
  # the additions' own consensus voice is used instead.
  min_seed_speech_seconds: 5.0
  # Find More, on the Review New Speaker Assignments screen, adds the utterances whose voice
  # is closest to the highlighted player's kept ones (and furthest from everyone else's),
  # up to speaker_bootstrap.target_total_speech_seconds per press. It only considers
  # utterances with at least this much speech.
  find_more_min_speech_seconds: 2.0

remove_backchannels:
  # Two passes drop pure backchannels ("yeah", "mhm", "right", ...):
  #   - Pre-review, automatic as part of Process -> Audio: speaker assignment
  #     isn't human-confirmed yet, so every wordlist-matching candidate is
  #     judged the same way regardless of speaker, via a batched LLM call
  #     (llm_model_lite below) asking whether the utterance right before it
  #     was a question -- a real short answer ("Yeah.") isn't mistaken for an
  #     acknowledgment.
  #   - Post-review, part of Process -> Outputs' Role Transcript step: purely
  #     mechanical, no LLM call -- a candidate is dropped only if it's still
  #     Unassigned Speaker after a human had the chance to fix it.
  #
  # An utterance longer than this many words is never considered a
  # backchannel candidate, regardless of wordlist match. Shared by both
  # passes.
  max_words: 3
  # The rest apply only to the pre-review pass -- the post-review pass makes
  # no LLM call at all.
  #
  # Candidates needing a question-check judgment are split into batches of
  # this size rather than sent as one call -- a large session can propose
  # hundreds of candidates, and one big call is what caused a real production
  # timeout (candidate_count=569 in a single call, timed out at 600s).
  batch_size: 50
  # How many batches run concurrently. Sequential batching would trade "one
  # call that might time out" for "many calls that reliably take longer in
  # total."
  max_concurrent_batches: 4
  # Timeout (seconds) per batch (not per whole pass) -- a batch is a small
  # fraction of the old worst-case candidate count.
  question_check_timeout: 120

name_corrections:
  # Process Session's Review Name Corrections step asks llm_model, in one call
  # over the whole cleaned transcript, for misheard player and character names.
  # Timeout (seconds) for that call.
  timeout: 300

# The default model for high-confidence LLM calls (e.g. proposing speaker
# identities from a transcript).
llm_model: anthropic/claude-sonnet-4-5
# A cheaper/faster model for lightweight LLM calls that don't need
# llm_model's full capability (e.g. remove_backchannels' candidate
# disambiguation above).
llm_model_lite: anthropic/claude-haiku-4-5
# A more capable model for the most demanding LLM calls (ledger and summary
# generation).
llm_model_high: openai/gpt-6-astra

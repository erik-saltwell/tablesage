# TableSage settings.
#
# Deployed to .tablesage/settings.yaml the first time the app runs in a given
# directory (this packaged copy is only the seed for that file -- once it
# exists, your edits there persist and this file is never consulted again).

remove_outliers:
  # Player Detail's "Clean Up" (C) prunes voice clips whose embedding falls
  # below this cosine-similarity bar against the centroid, one worst clip at
  # a time, recomputing between removals.
  min_sample_similarity: 0.6
  # Never prune a player's clips below this floor.
  min_samples: 5

session_audio_import:
  # Session Detail's "Import Audio" (I) always runs the imported recording
  # through the audio-cleaning pipeline; this toggles loudness normalization
  # on top of that cleaning.
  normalize_volume: false

audio_cleaning:
  # Player Detail's "Folder Imp" (F) asks whether to clean each wav through
  # the audio-cleaning pipeline before importing it; this toggles loudness
  # normalization on top of that cleaning, same as session_audio_import above.
  normalize_volume: false

transcription_and_diarization:
  # Session Detail's "Transcribe" (T) sends the session's input audio to
  # ElevenLabs Scribe for transcription and speaker diarization.
  timeout: 7200
  language_code: eng
  tag_audio_events: false
  model_id: scribe_v2

speaker_identification:
  # For utterances shorter than duration_override.min_seconds, a match whose margin over the
  # runner-up falls below this threshold is left as "Unassigned Speaker" rather than guessed.
  similarity_margin_threshold: 0.10
  # Experiment #7 found that longer clips contain enough voice evidence to use a lower margin.
  duration_override:
    min_seconds: 1.0
    similarity_margin_threshold: 0.04
  # Experiment #9 gives short clips more speaker evidence by concatenating only nearby speech
  # from the same ElevenLabs diarization cluster. The original duration still selects the margin
  # threshold above; widening never activates the looser duration override by itself.
  short_utterance_widening:
    enabled: true
    max_original_duration_seconds: 0.75
    target_duration_seconds: 1.0
    max_neighbor_gap_seconds: 2.0
  # Experiment #8 independently labels each diarization cluster from pooled, sufficiently long
  # utterance embeddings, then uses that label only to rescue short per-utterance abstentions.
  cluster_propagation:
    enabled: true
    evidence_min_duration_seconds: 0.5
    max_utterance_duration_seconds: 0.5
    cluster_margin_threshold: 0.0
    # Keep an abstention when its own embedding favors another player by at least this margin.
    contradiction_veto_margin_threshold: 0.02
  # Players List's "From Audio" compares a whole diarized-speaker centroid to existing players,
  # so it keeps its own non-duration-conditioned recommendation threshold.
  existing_player_match_similarity_margin_threshold: 0.08
  # When false, both margin checks above are skipped entirely -- the best-matching player is
  # always assigned, however close the runner-up was. Utterances too short to embed at all are
  # unaffected either way; they're still left "Unassigned Speaker" since there's no similarity
  # comparison to make for them in the first place.
  allow_unassigned: true
  # When true, "Transcribe" (T) writes an initial-match line per utterance to
  # .tablesage/logs/speaker_identification.log -- best/second-best speaker
  # match, the full per-speaker similarity vector, and why the utterance
  # landed where it did. Cluster-propagated utterances get a second override
  # line. Off by default: verbose, meant for digging into unexpectedly high
  # Unassigned Speaker counts, not routine runs.
  log_diagnostics: false

enhance_voices:
  # Players List's "From Session" (S) pulls high-confidence voice clips out
  # of a transcribed session's utterances. This is a stricter bar than
  # speaker_identification's own duration-conditioned assignment rule above -- an utterance can be
  # confident enough to attribute to a player without being confident enough
  # to bank as a new training sample for that player's voice profile.
  min_margin_for_voice_sample: 0.15
  # Utterances shorter than this make weak training samples; excluded.
  min_clip_seconds: 1.0
  # Utterances longer than this are likely a mis-segmented run-on; excluded.
  max_clip_seconds: 8.0

remove_backchannels:
  # Session Detail's "Clean" (C) step can drop pure backchannels ("yeah",
  # "mhm", "right", ...) from the preferred transcript. A candidate utterance
  # (short and wordlist-matching) spoken by the Unassigned speaker is dropped
  # outright; every other candidate is confirmed by a cheap LLM call
  # (llm_model_lite below) that judges whether the utterance right before it
  # was a question, so a real short answer to a question ("Yeah.") isn't
  # mistaken for an acknowledgment.
  # An utterance longer than this many words is never considered a
  # backchannel candidate, regardless of wordlist match.
  max_words: 3
  # Timeout (seconds) for the batched "was the previous utterance a
  # question?" LLM call above. A large session can propose hundreds of
  # candidates in one batch, which can run past a shorter timeout.
  question_check_timeout: 1200

# The default model for high-confidence LLM calls (e.g. proposing speaker
# identities from a transcript).
llm_model: anthropic/claude-sonnet-4-5
# A cheaper/faster model for lightweight LLM calls that don't need
# llm_model's full capability (e.g. remove_backchannels' candidate
# disambiguation above).
llm_model_lite: anthropic/claude-haiku-4-5
